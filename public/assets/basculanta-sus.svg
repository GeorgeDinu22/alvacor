<svg width="48" height="100" viewBox="0 0 48 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Basculantă văzută de sus, cu fața în jos (cabina jos). Aceleași culori ca bascula.svg -->
  <!-- roți: 2 punți spate (sus) + puntea din față (lângă cabină) -->
  <rect x="0" y="12" width="6" height="13" rx="2" fill="#1D2125"/>
  <rect x="42" y="12" width="6" height="13" rx="2" fill="#1D2125"/>
  <rect x="0" y="28" width="6" height="13" rx="2" fill="#1D2125"/>
  <rect x="42" y="28" width="6" height="13" rx="2" fill="#1D2125"/>
  <rect x="0" y="76" width="6" height="13" rx="2" fill="#1D2125"/>
  <rect x="42" y="76" width="6" height="13" rx="2" fill="#1D2125"/>
  <!-- șasiu între benă și cabină -->
  <rect x="12" y="60" width="24" height="8" fill="#3A4046"/>
  <!-- bena -->
  <rect x="4" y="2" width="40" height="60" rx="4" fill="#F2B705"/>
  <rect x="9" y="7" width="30" height="50" rx="2" fill="#C99700"/>
  <!-- încărcătura (pământ) -->
  <path d="M11 12C17 9 31 9 37 12V52C31 55 17 55 11 52V12Z" fill="#8A6A45"/>
  <path d="M15 20C20 17 28 17 33 20M14 32C20 29 28 29 34 32M15 44C20 41 28 41 33 44" stroke="#6E5236" stroke-width="2" stroke-linecap="round"/>
  <!-- cabina -->
  <rect x="6" y="66" width="36" height="30" rx="6" fill="#F2B705"/>
  <rect x="11" y="70" width="26" height="14" rx="3" fill="#C99700"/>
  <!-- parbriz (în față, jos) -->
  <rect x="10" y="86" width="28" height="7" rx="2" fill="#2E5A78"/>
  <!-- oglinzi -->
  <rect x="1" y="84" width="5" height="3" rx="1" fill="#1D2125"/>
  <rect x="42" y="84" width="5" height="3" rx="1" fill="#1D2125"/>
  <!-- faruri -->
  <rect x="9" y="95" width="6" height="3" rx="1" fill="#FFF3C4"/>
  <rect x="33" y="95" width="6" height="3" rx="1" fill="#FFF3C4"/>
</svg>
